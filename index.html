<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Hub - An Phúc Education</title>
    <style>
        :root { --bg: #f4f7fc; --sidebar: #ffffff; --primary: #2563eb; --text-main: #1f2937; --text-sub: #4b5563; --border: #e5e7eb; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; display: flex; height: 100vh; background-color: var(--bg); }
        
        /* Sidebar */
        .sidebar { width: 280px; background: var(--sidebar); padding: 30px 20px; display: flex; flex-direction: column; border-right: 1px solid var(--border); overflow-y: auto;}
        
        .logo-container { display: flex; flex-direction: column; align-items: center; margin-bottom: 35px; gap: 12px; }
        .logo-container img { width: 95px; height: 95px; object-fit: contain; border-radius: 12px; }
        .logo-text { font-size: 18px; font-weight: 800; color: var(--primary); letter-spacing: 1.5px; }

        .sidebar-title { font-size: 12px; font-weight: 700; color: #9ca3af; letter-spacing: 1px; margin-bottom: 20px; margin-left: 15px; text-transform: uppercase;}
        
        #menu-container { display: flex; flex-direction: column; gap: 5px; }
        .menu-item { display: flex; align-items: center; gap: 15px; padding: 14px 20px; border-radius: 16px; color: var(--text-sub); cursor: pointer; font-weight: 600; font-size: 15px; transition: all 0.2s ease;}
        .menu-item svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round;}
        .menu-item:hover:not(.active) { background: #f3f4f6; }
        .menu-item.active { background: var(--primary); color: white; box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2); }
        
        .main-content { flex: 1; display: flex; flex-direction: column; padding: 30px 50px; overflow-y: auto;}
        
        .header { display: flex; justify-content: flex-end; margin-bottom: 15px;}
        .btn-add { background: var(--primary); color: white; border: none; padding: 14px 28px; border-radius: 30px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); transition: 0.2s;}
        .btn-add:hover { background: #1d4ed8; }
        
        #cardContainer { display: flex; flex-direction: column; gap: 10px; padding-bottom: 40px;}
        .category-header { font-size: 14px; font-weight: 800; color: var(--primary); text-transform: uppercase; margin: 20px 0 15px 0; border-bottom: 2px solid #e5e7eb; padding-bottom: 8px; letter-spacing: 1px;}
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; margin-bottom: 10px;}
        .card { background: white; border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); display: flex; flex-direction: column; min-height: 160px;}
        
        .card-link-wrapper { text-decoration: none; color: inherit; display: block; flex: 1; }
        .card-header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; transition: 0.2s;}
        .card-link-wrapper:hover .card-title { color: var(--primary); }
        
        .web-icon { width: 48px; height: 48px; min-width: 48px; border-radius: 12px; object-fit: cover; background: #ffffff; padding: 2px; border: 1px solid #f3f4f6; box-shadow: 0 2px 5px rgba(0,0,0,0.04);}
        
        .card-title { font-size: 16px; font-weight: 700; color: var(--text-main); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .card-sub { font-size: 13px; color: #6b7280; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        
        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; border-top: 1px solid #f3f4f6; padding-top: 15px; gap: 10px;}
        .tag { font-size: 10px; background: #f3f4f6; padding: 6px 10px; border-radius: 6px; color: var(--text-sub); font-weight: 700; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px;}
        .actions { display: flex; gap: 12px; flex-shrink: 0; } 
        .action-link { color: var(--primary); font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s;}
        .action-edit { color: #f59e0b; font-size: 13px; font-weight: 600; cursor: pointer; }
        .action-del { color: #ef4444; font-size: 13px; font-weight: 600; cursor: pointer;}
        
        /* Modal Form */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); align-items: center; justify-content: center; z-index: 1000;}
        .modal-content { background: white; padding: 35px; border-radius: 20px; width: 420px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);}
        .modal-content h3 { margin: 0 0 10px 0; color: var(--text-main); }
        .modal-content input, .modal-content select { padding: 12px 15px; border: 1px solid var(--border); border-radius: 10px; width: 100%; font-size: 14px; outline: none; background: white; font-family: inherit;}
        .modal-buttons { display: flex; gap: 12px; justify-content: flex-end; margin-top: 10px;}
        .pass-result { margin-top: 15px; padding: 12px; background: #ecfdf5; color: #059669; border-radius: 8px; font-family: monospace; display: none; font-size: 14px; word-break: break-all;}
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo-container">
            <img src="logo.jpg" alt="Logo">
            <div class="logo-text">LINK WEB</div>
        </div>
        
        <div class="sidebar-title">DANH MỤC</div>
        <!-- Menu sẽ được JS tự động vẽ ra -->
        <div id="menu-container"></div>
    </div>

    <div class="main-content">
        <div class="header">
            <button class="btn-add" onclick="openAddModal()">+ THÊM MỚI</button>
        </div>
        <div id="cardContainer">
            <!-- Data load here -->
        </div>
    </div>

    <!-- Modal Form -->
    <div class="modal" id="formModal">
        <div class="modal-content">
            <h3 id="modalTitle">Thêm Trang Web</h3>
            <input type="text" id="wName" placeholder="Tên trang web">
            <input type="text" id="wLink" placeholder="https://...">
            
            <select id="wCategorySelect" onchange="toggleCategoryInput()"></select>
            <input type="text" id="wCategoryInput" placeholder="Nhập tên danh mục mới..." style="display:none;">

            <input type="text" id="wAccount" placeholder="Tài khoản">
            <input type="password" id="wPass" placeholder="Mật khẩu">
            <div class="modal-buttons">
                <button class="btn-add" style="background:#9ca3af; padding: 10px 20px;" onclick="closeModal()">Hủy</button>
                <button class="btn-add" style="padding: 10px 20px;" onclick="saveData()">Lưu</button>
            </div>
        </div>
    </div>

    <script>
        // === CẤU HÌNH API CỦA THẦY ===
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxiEixnqGUKtOtnZT35T0cKOClpRc2igbyhsyBhusoXj7HH7KJOuFJYHZuQKace-DwL/exec";
        const SECRET_COMMUNICATION_TOKEN = "ThayDuc_Authentication_Secret_Token_Long_String_2026"; 
        
        let globalDataList = [];
        let currentCategoryFilter = 'all';
        let editingId = null;

        document.addEventListener("DOMContentLoaded", loadData);

        async function loadData() {
            try {
                const response = await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify({ action: "getList" }) });
                const result = await response.json();
                if(result.status === "success") {
                    globalDataList = result.data; 
                    renderSidebar(); 
                    applyFilters(); 
                }
            } catch (e) { console.error("Lỗi tải dữ liệu"); }
        }

        // === THUẬT TOÁN TẠO MENU ===
        function renderSidebar() {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';
            
            container.innerHTML += `
                <div class="menu-item ${currentCategoryFilter === 'all' ? 'active' : ''}" onclick="filterData('all', this)">
                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    Tất cả
                </div>
            `;
            
            const dataCategories = globalDataList.map(item => item.category).filter(c => c && c.trim() !== "");
            const allCategories = [...new Set(["Công việc", "Cá nhân", ...dataCategories])];
            
            allCategories.forEach(cat => {
                let iconSvg = '';
                if (cat === "Công việc") {
                    iconSvg = `<svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>`;
                } else if (cat === "Cá nhân") {
                    iconSvg = `<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>`;
                } else {
                    iconSvg = `<svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>`;
                }
                
                container.innerHTML += `
                    <div class="menu-item ${currentCategoryFilter === cat ? 'active' : ''}" onclick="filterData('${cat}', this)">
                        ${iconSvg}
                        ${cat}
                    </div>
                `;
            });
        }

        function updateCategorySelect() {
            const select = document.getElementById('wCategorySelect');
            select.innerHTML = '';
            
            const dataCategories = globalDataList.map(item => item.category).filter(c => c && c.trim() !== "");
            const allCategories = [...new Set(["Công việc", "Cá nhân", ...dataCategories])];
            
            allCategories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.innerText = cat;
                select.appendChild(option);
            });
            
            const newOption = document.createElement('option');
            newOption.value = "__NEW__";
            newOption.innerText = "➕ Thêm tag mới...";
            select.appendChild(newOption);
        }

        function toggleCategoryInput() {
            const select = document.getElementById('wCategorySelect');
            const input = document.getElementById('wCategoryInput');
            if (select.value === "__NEW__") {
                input.style.display = "block";
                input.focus();
            } else {
                input.style.display = "none";
            }
        }

        function filterData(category, element) {
            currentCategoryFilter = category;
            renderSidebar(); 
            applyFilters();
        }

        function applyFilters() {
            let filtered = globalDataList;
            if (currentCategoryFilter !== 'all') {
                filtered = filtered.filter(item => item.category === currentCategoryFilter);
            }
            renderCards(filtered);
        }

        // === THUẬT TOÁN ĐỔI LOGO (LOẠI BỎ HOÀN TOÀN QUẢ CẦU MỜ) ===
        function generateIconHtml(link, name) {
            let domain = "";
            try { 
                let parseUrl = link.startsWith('http') ? link : 'https://' + link;
                domain = new URL(parseUrl).hostname.toLowerCase(); 
            } catch(e) {}

            let iconUrl = "";
            let linkStr = link.toLowerCase();
            let nameStr = name.toLowerCase();
            
            // Xử lý cứng các trang web hay hiển thị lỗi
            if (domain.includes("vnedu.vn") || nameStr.includes("vnedu")) {
                // Tạo ảnh chữ V với viền xanh nhạt, chữ xanh đậm chuyên nghiệp
                iconUrl = "https://ui-avatars.com/api/?name=V&background=e0f2fe&color=0284c7&size=128&font-size=0.65&bold=true";
            } 
            else if (domain.includes("temis") || domain.includes("csdl") || nameStr.includes("temis")) {
                // Tạo ảnh chữ T với viền hồng nhạt, chữ hồng đậm
                iconUrl = "https://ui-avatars.com/api/?name=T&background=fce7f3&color=be185d&size=128&font-size=0.65&bold=true";
            }
            else if (domain.includes("vercel") || nameStr.includes("vercel")) {
                iconUrl = "https://assets.vercel.com/image/upload/q_auto/front/favicon/vercel/180x180.png";
            } 
            else if (domain.includes("anphuc") || nameStr.includes("an phúc")) {
                iconUrl = "logo.jpg";
            } 
            else if (domain.includes("github.com") || nameStr.includes("github")) {
                iconUrl = "https://github.githubassets.com/favicons/favicon.png";
            } 
            else if (domain.includes("mail.google.com") || domain.includes("gmail") || nameStr.includes("mail")) {
                iconUrl = "https://ssl.gstatic.com/ui/v1/icons/mail/rfr/gmail.ico";
            }
            else if (domain !== "") {
                // Dùng icon.horse tốt hơn Google rất nhiều, không bao giờ ra quả cầu mờ
                iconUrl = `https://icon.horse/icon/${domain}`;
            }

            // Fallback nếu web lạ hoàn toàn: Lấy chữ cái đầu tiên của tên web
            let letter = name.charAt(0).toUpperCase();
            let fallbackUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(letter)}&background=f3f4f6&color=2563eb&size=128&font-size=0.6&bold=true`;
            
            if (iconUrl === "") iconUrl = fallbackUrl;

            // Nếu tải iconUrl bị lỗi (404), nó sẽ tự động fallback về chữ cái
            return `<img src="${iconUrl}" class="web-icon" alt="icon" onerror="this.onerror=null; this.src='${fallbackUrl}';">`;
        }

        // === RENDER THẺ WEB ===
        function renderCards(data) {
            const container = document.getElementById('cardContainer');
            container.innerHTML = '';
            
            if (data.length === 0) {
                container.innerHTML = '<p style="color: #6b7280; font-size: 15px;">Không có trang web nào trong mục này.</p>';
                return;
            }

            const groupedData = {};
            data.forEach(item => {
                const cat = item.category || "Khác";
                if (!groupedData[cat]) groupedData[cat] = [];
                groupedData[cat].push(item);
            });

            for (const category in groupedData) {
                if (currentCategoryFilter === 'all') {
                    const header = document.createElement('h3');
                    header.className = 'category-header';
                    header.innerText = category;
                    container.appendChild(header);
                }

                const grid = document.createElement('div');
                grid.className = 'grid';

                groupedData[category].forEach(item => {
                    let subText = item.account ? item.account : item.link.replace('https://', '');
                    
                    // Gọi hàm tạo icon xử lý bên trên
                    let iconHtml = generateIconHtml(item.link, item.name);

                    grid.innerHTML += `
                        <div class="card">
                            <a href="${item.link}" target="_blank" class="card-link-wrapper">
                                <div class="card-header">
                                    ${iconHtml}
                                    <div style="overflow: hidden; width: 100%;">
                                        <h3 class="card-title" title="${item.name}">${item.name}</h3>
                                        <div class="card-sub" title="${subText}">${subText}</div>
                                    </div>
                                </div>
                            </a>
                            
                            <div class="card-footer">
                                <span class="tag" title="${item.category}">${item.category}</span>
                                <div class="actions">
                                    <span class="action-link" onclick="handleViewPass('${item.id}', this)">Xem Pass</span>
                                    <span class="action-edit" onclick="openEditModal('${item.id}')">Sửa</span>
                                    <span class="action-del" onclick="deleteWeb('${item.id}')">Xóa</span>
                                </div>
                            </div>
                            <div class="pass-result" id="pass-${item.id}"></div>
                        </div>
                    `;
                });
                container.appendChild(grid);
            }
        }

        // === LOGIC FORM ===
        function closeModal() { document.getElementById('formModal').style.display = 'none'; }
        
        function openAddModal() {
            editingId = null;
            document.getElementById('modalTitle').innerText = "Thêm Trang Web";
            document.getElementById('wName').value = "";
            document.getElementById('wLink').value = "";
            
            updateCategorySelect();
            document.getElementById('wCategorySelect').value = "Công việc"; 
            document.getElementById('wCategoryInput').style.display = "none";
            document.getElementById('wCategoryInput').value = "";
            
            document.getElementById('wAccount').value = "";
            document.getElementById('wPass').value = "";
            document.getElementById('wPass').placeholder = "Mật khẩu";
            document.getElementById('formModal').style.display = 'flex';
        }

        function openEditModal(id) {
            editingId = id;
            const item = globalDataList.find(x => x.id === id);
            if(!item) return;

            document.getElementById('modalTitle').innerText = "Sửa Thông Tin Web";
            document.getElementById('wName').value = item.name;
            document.getElementById('wLink').value = item.link;
            
            updateCategorySelect();
            const select = document.getElementById('wCategorySelect');
            const input = document.getElementById('wCategoryInput');
            
            let exists = Array.from(select.options).some(opt => opt.value === item.category);
            if (exists) {
                select.value = item.category;
                input.style.display = "none";
                input.value = "";
            } else {
                select.value = "__NEW__";
                input.style.display = "block";
                input.value = item.category;
            }

            document.getElementById('wAccount').value = item.account;
            document.getElementById('wPass').value = "";
            document.getElementById('wPass').placeholder = "(Để trống nếu không đổi mật khẩu)";
            document.getElementById('formModal').style.display = 'flex';
        }

        async function saveData() {
            let categoryVal = document.getElementById('wCategorySelect').value;
            if (categoryVal === "__NEW__") {
                categoryVal = document.getElementById('wCategoryInput').value.trim();
                if (!categoryVal) {
                    alert("Vui lòng nhập tên danh mục mới!");
                    return;
                }
            }

            const payload = {
                action: editingId ? "update" : "add",
                id: editingId,
                name: document.getElementById('wName').value,
                link: document.getElementById('wLink').value,
                category: categoryVal,
                account: document.getElementById('wAccount').value,
                password: document.getElementById('wPass').value
            };
            
            const btn = document.querySelector('#formModal .btn-add:nth-child(2)');
            btn.innerText = "Đang lưu...";
            
            await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify(payload) });
            btn.innerText = "Lưu";
            closeModal(); 
            loadData();
        }

        async function deleteWeb(id) {
            if(confirm("Bạn có chắc chắn muốn xóa website này?")) {
                await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify({ action: "delete", id: id }) });
                loadData();
            }
        }

        // === BẢO MẬT SINH TRẮC HỌC WEBAUTHN ===
        async function triggerBiometricAuth() {
            if (!window.PublicKeyCredential) return false; 
            const challenge = new Uint8Array(32);
            window.crypto.getRandomValues(challenge);
            try {
                await navigator.credentials.create({
                    publicKey: {
                        challenge: challenge,
                        rp: { name: "Portal Link Hub", id: window.location.hostname },
                        user: { id: new Uint8Array(16), name: "admin", displayName: "Xác thực bảo mật" },
                        pubKeyCredParams: [{ type: "public-key", alg: -7 }],
                        authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
                        timeout: 60000 
                    }
                });
                return true;
            } catch (err) { return false; }
        }

        async function handleViewPass(webId, btnElement) {
            const passDisplay = document.getElementById(`pass-${webId}`);
            
            if (btnElement.innerText === "Ẩn Pass") {
                passDisplay.style.display = "none";
                btnElement.innerText = "Xem Pass";
                btnElement.style.color = "var(--primary)";
                return;
            }

            passDisplay.style.display = "block";
            passDisplay.innerText = "Đang chờ quét Face ID/Vân tay...";
            
            const isVerified = await triggerBiometricAuth();
            if (!isVerified) {
                passDisplay.innerText = "Xác thực thất bại.";
                passDisplay.style.color = "#ef4444";
                passDisplay.style.backgroundColor = "#fee2e2";
                
                setTimeout(() => { passDisplay.style.display = "none"; }, 3000);
                return;
            }

            passDisplay.innerText = "Đang lấy mật khẩu...";
            try {
                const response = await fetch(GAS_API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "getPass", id: webId, token: SECRET_COMMUNICATION_TOKEN })
                });
                const result = await response.json();
                
                if (result.status === "success") {
                    passDisplay.innerText = "Pass: " + result.pass;
                    passDisplay.style.color = "#059669";
                    passDisplay.style.backgroundColor = "#ecfdf5";
                    
                    btnElement.innerText = "Ẩn Pass";
                    btnElement.style.color = "#ef4444"; 
                } else {
                    passDisplay.innerText = "Lỗi: " + result.message;
                }
            } catch (e) { passDisplay.innerText = "Lỗi mạng."; }
        }
    </script>
</body>
</html>
